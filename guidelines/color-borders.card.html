<!-- @dsCard group="Colors" viewport="700x150" name="Borders" subtitle="Three hairline weights carry all the structure" -->
<!doctype html><html class="dark"><head><meta charset="utf-8"><title>Borders</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:#000;font-family:var(--font-sans);color:var(--foreground)}
.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:64px}.chip{height:56px;border-radius:8px;border:1px solid var(--white-10)}
.n{margin-top:6px;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--neutral-300);font-family:var(--font-mono)}
.v{font-size:9px;color:var(--neutral-600);font-family:var(--font-mono)}
.row{display:flex;align-items:baseline;gap:14px}.mono{font-family:var(--font-mono)}
.meta{font-size:10px;color:var(--neutral-600);font-family:var(--font-mono);white-space:nowrap}
</style></head><body>
<div class="g">
  <div class="sw"><div class="chip" style="background:var(--card);border:1px solid var(--border)"></div><div class="n">--border</div><div class="v">#1f1f1f</div></div>
  <div class="sw"><div class="chip" style="background:var(--card);border:1px solid var(--border-hairline)"></div><div class="n">--border-hairline</div><div class="v">neutral-800</div></div>
  <div class="sw"><div class="chip" style="background:var(--card);border:1px solid var(--border-card)"></div><div class="n">--border-card</div><div class="v">white/10</div></div>
  <div class="sw"><div class="chip" style="background:var(--card);border:1px solid var(--border-strong)"></div><div class="n">--border-strong</div><div class="v">neutral-700 · hover</div></div>
  <div class="sw"><div class="chip" style="background:var(--card);border:1px solid var(--ring)"></div><div class="n">--ring</div><div class="v">#333 · focus</div></div>
</div></body></html>
